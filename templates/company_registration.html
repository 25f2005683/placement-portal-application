<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Registration</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="register-card">
            <div id="form-body">
                <h2 class="form-title">Company Registration</h2>
                <p class="form-subtitle">Create your company account for the placement portal</p>

                <form action="/company-register" method="POST">

                    <div class="row mb-3 align-items-center">
                        <label for="company_name" class="col-sm-4 col-form-label">Company Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="company_name" name="company_name" placeholder="Enter company name">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="hr_name" class="col-sm-4 col-form-label">HR Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="hr_name" name="hr_name" placeholder="Enter HR name">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="email" class="col-sm-4 col-form-label">Email Address</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" id="email" name="email" placeholder="hr@company.com">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="password" class="col-sm-4 col-form-label">Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="confirm_password" class="col-sm-4 col-form-label">Confirm Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter your password">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="phone" class="col-sm-4 col-form-label">Phone Number</label>
                        <div class="col-sm-8">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="website" class="col-sm-4 col-form-label">Website</label>
                        <div class="col-sm-8">
                            <input type="url" class="form-control" id="website" name="website" placeholder="https://www.company.com">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="industry_type" class="col-sm-4 col-form-label">Industry Type</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="industry_type" name="industry_type" placeholder="e.g. IT, Finance, Consulting">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="location" class="col-sm-4 col-form-label">Location</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="location" name="location" placeholder="Enter company location">
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label for="description" class="col-sm-4 col-form-label">Description</label>
                        <div class="col-sm-8">
                            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Write a short company description"></textarea>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary form-btn">Register</button>
                    </div>
                </form>

                <div class="bottom-links mt-4">
                    <p>Already have an account? <a href="/login">Login</a></p>
                    <p>New student? <a href="/student-register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
