<!DOCTYPE html>
<html lang="en">
<head>
    <title>Placement Portal - Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="main" class="py-5">
        <div id="canvas" class="register-card container bg-white shadow rounded p-4" style="max-width: 850px;">
            <div id="form-body">
                <h2 class="form-title text-center mb-2">Student Registration</h2>
                <p class="form-subtitle text-center text-muted mb-4">
                    Create your student account for the Placement Portal
                </p>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-warning text-center" role="alert">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="/student_register" method="POST" enctype="multipart/form-data">

                    <div class="row mb-3 align-items-center">
                        <label for="full_name" class="col-sm-4 col-form-label">Full Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="email" class="col-sm-4 col-form-label">Email Address</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="password" class="col-sm-4 col-form-label">Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="confirm_password" class="col-sm-4 col-form-label">Confirm Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="roll_number" class="col-sm-4 col-form-label">Roll Number</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="roll_number" name="roll_number" placeholder="Enter your roll number" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="branch" class="col-sm-4 col-form-label">Branch</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="branch" name="branch" placeholder="Enter your branch" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="year" class="col-sm-4 col-form-label">Year</label>
                        <div class="col-sm-8">
                            <input type="number" class="form-control" id="year" name="year" placeholder="Enter current year (e.g. 2)" min="1" max="4" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="cgpa" class="col-sm-4 col-form-label">CGPA</label>
                        <div class="col-sm-8">
                            <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" placeholder="Enter your CGPA" min="0" max="10" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="phone" class="col-sm-4 col-form-label">Phone Number</label>
                        <div class="col-sm-8">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="skills" class="col-sm-4 col-form-label">Skills</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="skills" name="skills" placeholder="e.g. Python, SQL, HTML, CSS">
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label for="resume" class="col-sm-4 col-form-label">Upload Resume</label>
                        <div class="col-sm-8">
                            <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary w-25">Register</button>
                    </div>
                </form>

                <div class="bottom-links mt-4 text-center">
                    <p class="mb-1">Already Register? <a href="/login">Login</a></p>
                    <p class="mb-0">Are you a new company? <a href="/company_register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
