<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="main" class="d-flex justify-content-center align-items-center min-vh-100">
        <div id="canvas" class="login-card p-4 shadow rounded bg-white" style="width: 100%; max-width: 450px;">
            <div id="form-body">
                <h2 class="form-title text-center mb-2">Placement Portal Login</h2>
                <p class="form-subtitle text-center text-muted mb-4">
                    Login as Admin, Student, or Company
                </p>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-warning text-center" role="alert">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="role" class="form-label">Login As</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value=""disabled selected>Login as</option>
                            <option value="admin">Admin</option>
                            <option value="student">Student</option>
                            <option value="company">Company</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address / Admin Username</label>
                        <input type="text" class="form-control" id="email" name="email" placeholder="Enter email or admin username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary w-50">Login</button>
                    </div>
                </form>

                <div class="bottom-links mt-4 text-center">
                    <p class="mb-1">Are you a new student? <a href="/student_register">Register here</a></p>
                    <p class="mb-0">Are you a new company? <a href="/company_register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
