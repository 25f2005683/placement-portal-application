<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Form</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
    <style>
        #canvas{
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border-radius: 18px;
            border: 1px solid;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
<body>
    <div id="main">
        <div id="canvas" class="login-card">
            <div id="form-body">
                <h2 class="form-title" >Login</h2>
                <p class="form-subtitle">Sign in to access your placement portal</p>
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary form-btn">Login</button>
                    </div>
                </form>
                <br>
                <div class="bottom-links">
                    <p>New student? <a href="/student-register">Register here</a></p>
                    <p>New company? <a href="/company-register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
