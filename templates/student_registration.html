<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="register-card">
            <div id="form-body">
                <h2 class="form-title">Student Registration</h2>
                <p class="form-subtitle">Create your student account for the placement portal</p>

                <form action="/student-register" method="POST" enctype="multipart/form-data">
                    
                    <div class="row mb-3 align-items-center">
                        <label for="full_name" class="col-sm-4 col-form-label">Full Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter your full name">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="email" class="col-sm-4 col-form-label">Email Address</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="password" class="col-sm-4 col-form-label">Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="confirm_password" class="col-sm-4 col-form-label">Confirm Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter your password">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="roll_number" class="col-sm-4 col-form-label">Roll Number</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="roll_number" name="roll_number" placeholder="Enter your roll number">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="branch" class="col-sm-4 col-form-label">Branch</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="branch" name="branch" placeholder="Enter your branch">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="year" class="col-sm-4 col-form-label">Year</label>
                        <div class="col-sm-8">
                            <input type="number" class="form-control" id="year" name="year" placeholder="Enter your year (e.g. 2)">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="cgpa" class="col-sm-4 col-form-label">CGPA</label>
                        <div class="col-sm-8">
                            <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" placeholder="Enter your CGPA">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="phone" class="col-sm-4 col-form-label">Phone Number</label>
                        <div class="col-sm-8">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="skills" class="col-sm-4 col-form-label">Skills</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="skills" name="skills" placeholder="e.g. Python, SQL, HTML, CSS">
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label for="resume" class="col-sm-4 col-form-label">Upload Resume</label>
                        <div class="col-sm-8">
                            <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary form-btn">Register</button>
                    </div>
                </form>

                <div class="bottom-links mt-4">
                    <p>Already have an account? <a href="/login">Login</a></p>
                    <p>New company? <a href="/company-register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
